    <style>
        :root {
            --bg-color: #f4ede4;
            --container-bg: #ffffff;
            --primary-color: #3d2b1f;
            --accent-color: #c68e5a;
            --text-main: #2c1d11;
            --text-muted: #8c7667;
            --border-color: #ebdcd0;
            --highlight-bg: #fdfcfb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 460px;
            margin: 0 auto;
            padding: 15px 10px; /* 紧凑视窗外边距 */
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--container-bg);
            padding: 20px 22px; /* 压缩内边距 */
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(61, 43, 31, 0.06);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .bg-abstract-top { position: absolute; top: -30px; right: -40px; width: 140px; height: 140px; opacity: 0.08; z-index: -1; pointer-events: none; }
        .bg-abstract-bottom { position: absolute; bottom: -50px; left: -40px; width: 160px; height: 160px; opacity: 0.05; z-index: -1; pointer-events: none; }

        .brand-header { text-align: left; margin-bottom: 16px; }
        .brand-header .en-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--accent-color); text-transform: uppercase; margin-bottom: 2px; }
        .brand-header .zh-title { font-size: 20px; font-weight: 800; color: var(--primary-color); }

        .input-group {
            margin-bottom: 14px; /* 压缩项间距 */
            position: relative;
            z-index: 2;
        }

        /* 方案与比例并排双列排版 */
        .grid-two-columns {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }
        .grid-two-columns .input-group { margin-bottom: 0; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(235, 220, 208, 0.7);
            border-radius: 18px;
            padding: 12px 16px; /* 紧凑卡片空间 */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .center-display-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            height: 38px;
            user-select: none;
        }

        .beans-large-text {
            font-size: 32px; /* 稍微内敛但依然醒目 */
            font-weight: 800;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
        }

        .beans-unit {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .edit-pencil-icon {
            width: 16px;
            height: 16px;
            color: var(--accent-color);
            opacity: 0.8;
            margin-top: 4px;
        }

        .beans-input-hidden {
            display: none;
            width: 100px;
            height: 36px;
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-color);
            text-align: center;
            border: 2px solid var(--accent-color);
            border-radius: 10px;
            background: #fff;
            outline: none;
        }

        .grinder-slider-box {
            position: relative;
            width: 100%;
            padding: 4px 0;
            display: flex;
            align-items: center;
        }

        .grinder-fine-ticks {
            position: absolute;
            left: 6px;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            height: 12px;
            background: 
                linear-gradient(90deg, rgba(61, 43, 31, 0.45) 1.5px, transparent 1.5px) repeat-x,
                linear-gradient(90deg, rgba(61, 43, 31, 0.22) 1px, transparent 1px) repeat-x;
            background-size: 10% 100%, 2% 55%; /* 适配 5-30g 新跨度精密视觉 */
            opacity: 0.9;
            pointer-events: none;
        }

        .grinder-slider-box::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 16px;
            background-color: var(--accent-color);
            z-index: 1;
            pointer-events: none;
            border-radius: 1px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 24px;
            background: transparent;
            outline: none;
            margin: 0;
            cursor: ew-resize;
            position: relative;
            z-index: 2;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 22px;
            border-radius: 2px;
            background: var(--primary-color);
            box-shadow: 0 1px 5px rgba(61, 43, 31, 0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 22px;
            border-radius: 2px;
            background: var(--primary-color);
            border: none;
            box-shadow: 0 1px 5px rgba(61, 43, 31, 0.4);
        }

        .select-wrapper {
            position: relative;
            display: block;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #fff;
            overflow: hidden;
            width: 100%;
            height: 46px; /* 压缩高度 */
        }

        select { 
            width: 100%; 
            height: 100%;
            padding: 0 36px 0 12px; 
            border: none; 
            font-size: 14px; 
            background: transparent; 
            color: var(--text-main); 
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 8px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 100%;
            position: absolute;
            right: 0;
            top: 0;
            background: #fdfcfb;
            border-left: 1px solid var(--border-color);
            pointer-events: none;
        }

        #ratioContainer { display: block; background-color: #faf7f2; }
        
        .recipe-details-box { margin-top: 10px; border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; background: var(--highlight-bg); }
        summary { padding: 10px 14px; background: #f4ede4; color: var(--primary-color); font-weight: 700; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: ""; width: 5px; height: 5px; border-right: 2px solid var(--primary-color); border-bottom: 2px solid var(--primary-color); transform: rotate(45deg); }
        details[open] summary::after { transform: rotate(-135deg); }
        
        .recipe-details-box .details-content { display: none; }
        details[open] .details-content { 
            padding: 14px 16px; 
            font-size: 12px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px 16px; 
            background: #fff; 
        }

        .info-item { display: flex; flex-direction: column; }
        .info-item.full-width { grid-column: span 2; border-top: 1px dashed #f0eae1; padding-top: 8px; }
        .info-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .info-value { color: var(--text-main); font-weight: 600; font-size: 13px; }
        
        button#mainBtn { width: 100%; padding: 14px; background-color: var(--primary-color); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; letter-spacing: 1px; cursor: pointer; margin-top: 14px; line-height: 1; }
        
        .result { margin-top: 16px; padding: 16px 16px; background-color: var(--highlight-bg); border-radius: 16px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary-color); display: none; }
        .result h3 { margin: 0 0 10px 0; color: var(--primary-color); font-size: 14px; font-weight: 800; }
        .total-highlight { font-size: 12px; margin-bottom: 12px; background: #f4ede4; padding: 10px 14px; border-radius: 10px; color: var(--primary-color); }
        .step { margin: 10px 0; padding-bottom: 10px; border-bottom: 1px dashed #e6dfd8; }
        .step:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .step-title { font-weight: 700; color: var(--primary-color); margin-bottom: 2px; display: flex; justify-content: space-between; font-size: 13px; }
        .step-details { font-size: 14px; color: #000; margin-bottom: 2px; }
        .step-note { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <svg class="bg-abstract-top" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.5" stroke-linecap="round"><path d="M10 20 L90 20 L50 85 Z" /><line x1="25" y1="44" x2="75" y2="44" stroke-dasharray="2 3" /><circle cx="50" cy="20" r="18" fill="none" stroke-width="1" /><path d="M40 10 C45 20 50 20 60 30" stroke-width="1.5" /></svg>
    <svg class="bg-abstract-bottom" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.2"><path d="M10 90 C10 40, 50 30, 60 30" stroke-width="2" /><path d="M60 30 C75 30, 90 10, 85 5" stroke-width="1.5" stroke-linecap="round" /><circle cx="10" cy="90" r="30" stroke-dasharray="4 4" /></svg>

    <div class="brand-header">
        <div class="en-title">Coffee Brewing Assistant</div>
        <div class="zh-title">咖啡冲煮助手</div>
    </div>
    
    <div class="input-group">
        <label>咖啡粉重量:</label>
        <div class="glass-panel">
            <div class="center-display-wrapper" id="displayWrapper" onclick="enableManualInput()">
                <span class="beans-large-text" id="beansValue">15.0</span>
                <span class="beans-unit">克</span>
                <svg class="edit-pencil-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"></path>
                </svg>
            </div>
            <input type="number" id="beansInput" class="beans-input-hidden" step="0.1" min="5" max="30" onblur="disableManualInput()">

            <div class="grinder-slider-box">
                <div class="grinder-fine-ticks"></div>
                <input type="range" id="beansSlider" min="5" max="30" step="0.1" value="15.0" oninput="syncFromSlider(this.value)">
            </div>
        </div>
    </div>

    <div class="grid-two-columns">
        <div class="input-group">
            <label for="recipe">选择冲煮方案:</label>
            <div class="select-wrapper">
                <select id="recipe" onchange="onRecipeChange()">
                    <option value="classic">经典三段式</option>
                    <option value="four_six">粕谷哲 4:6 法</option>
                    <option value="hoffmann">Hoffmann 经典 V60</option>
                    <option value="rao">Scott Rao 高萃取版</option>
                    <option value="hedrick_two">Hedrick 极简双段法</option>
                    <option value="hedrick_univ">Hedrick 通用排气法</option>
                    <option value="hedrick_ice">Hedrick 冰镇流</option>
                    <option value="peng_x">彭近洋 无差别 X 法</option>
                    <option value="liftee_okay">Liftee 增甜平底流</option>
                    <option value="onyx_wave">Onyx 经典 Wave</option>
                    <option value="rolf_april">Patrik Rolf 激烈萃取</option>
                    <option value="collective_wave">Collective 极浅烘</option>
                    <option value="gagne_pulsar">Gagné 零旁通科学流</option>
                    <option value="one_pour">极致一刀流</option>
                </select>
            </div>
        </div>

        <div class="input-group" id="ratioContainer">
            <label for="ratio">粉水比:</label>
            <div class="select-wrapper">
                <select id="ratio">
                    <option value="16.67">1 : 16.7</option>
                    <option value="16">1 : 16</option>
                    <option value="15">1 : 15</option>
                    <option value="17">1 : 17</option>
                    <option value="13">1 : 13</option>
                </select>
            </div>
        </div>
    </div>

    <details class="recipe-details-box" id="recipeDetails"><summary>查看当前方案策略详述</summary><div class="details-content"><div class="info-item"><span class="info-label">推荐水温</span><span class="info-value" id="viewTemp">-</span></div><div class="info-item"><span class="info-label">推荐器具</span><span class="info-value" id="viewGear">-</span></div><div class="info-item"><span class="info-label">研磨度锚点</span><span class="info-value" id="viewGrind">-</span></div><div class="info-item"><span class="info-label">预估时间</span><span class="info-value" id="viewTime">-</span></div><div class="info-item full-width"><span class="info-label">风味特征表现</span><span class="info-value" id="viewFlavor">-</span></div></div></details>
    
    <button onclick="calculateBrew()" id="mainBtn">生成今日冲煮看板</button>
    <div id="resultBox" class="result"><h3>冲煮看板</h3><div class="total-highlight">设定比例：<strong><span id="currentRatio"></span></strong> | 目标总水：<strong id="totalWater" style="color:var(--accent-color); font-size:16px;"></strong> <strong>g</strong></div><div id="stepsList"></div></div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js?v=3.5')
                .then(reg => console.log('PWA 离线管家已强行重构升级。'))
                .catch(err => console.log(err));
        });
    }

    const sliderEl = document.getElementById('beansSlider');
    const textEl = document.getElementById('beansValue');
    const inputEl = document.getElementById('beansInput');
    const wrapperEl = document.getElementById('displayWrapper');

    function syncFromSlider(val) {
        textEl.innerText = parseFloat(val).toFixed(1);
        inputEl.value = parseFloat(val).toFixed(1);
    }

    function enableManualInput() {
        wrapperEl.style.display = 'none';
        inputEl.style.display = 'block';
        inputEl.value = textEl.innerText;
        inputEl.focus();
    }

    function disableManualInput() {
        let val = parseFloat(inputEl.value);
        const min = parseFloat(sliderEl.min);
        const max = parseFloat(sliderEl.max);

        if (isNaN(val) || val < min) val = min;
        if (val > max) val = max;

        val = Number(val.toFixed(1));
        
        textEl.innerText = val.toFixed(1);
        sliderEl.value = val;

        inputEl.style.display = 'none';
        wrapperEl.style.display = 'flex';
    }

    function updateRecipeDetailsView() { 
        const recipeKey = document.getElementById('recipe').value; 
        const recipe = recipes[recipeKey]; 
        document.getElementById('viewTemp').innerText = recipe.temp; 
        document.getElementById('viewGear').innerText = recipe.gear; 
        document.getElementById('viewGrind').innerText = recipe.grind; 
        document.getElementById('viewTime').innerText = recipe.time; 
        document.getElementById('viewFlavor').innerText = recipe.flavor; 
        
        const ratioContainer = document.getElementById('ratioContainer'); 
        const ratioSelect = document.getElementById('ratio');
        
        if (recipe.hasDynamicRatio) { 
            ratioContainer.style.style.display = 'block'; 
            if(recipe.defaultRatio) ratioSelect.value = recipe.defaultRatio;
        } else { 
            ratioContainer.style.style.display = 'block'; // 保持双列结构不塌陷
            ratioSelect.value = recipe.fixedRatio.toString();
        } 
    }
    
    function onRecipeChange() { 
        updateRecipeDetailsView(); 
        document.getElementById('resultBox').style.style.display = 'none'; 
        document.getElementById('recipeDetails').removeAttribute('open');
    }
    
    function calculateBrew() { 
        const beans = parseFloat(sliderEl.value); 
        const recipeKey = document.getElementById('recipe').value; 
        const recipe = recipes[recipeKey]; 
        if (!beans || beans <= 0) { alert("请确定正确的咖啡豆克重！"); return; } 
        
        let activeRatio = recipe.hasDynamicRatio ? parseFloat(document.getElementById('ratio').value) : recipe.fixedRatio; 
        const totalWater = beans * activeRatio; 
        document.getElementById('currentRatio').innerText = `1 : ${activeRatio}`; 
        document.getElementById('totalWater').innerText = totalWater.toFixed(1); 
        
        const stepsList = document.getElementById('stepsList'); 
        stepsList.innerHTML = ''; 
        let cumulativeWater = 0; 
        
        recipe.steps.forEach((step) => { 
            const stepWater = totalWater * step.percentage; 
            cumulativeWater += stepWater; 
            const stepDiv = document.createElement('div'); 
            stepDiv.className = 'step'; 
            stepDiv.innerHTML = `<div class="step-title"><span>${step.name}</span><span style="font-size:10px; color:var(--text-muted);">${(step.percentage * 100).toFixed(0)}%</span></div><div class="step-details">注水至：<strong style="color:var(--primary-color); font-size:15px;">${cumulativeWater.toFixed(1)}g</strong> <span style="color:var(--text-muted); font-size:11px;">(+${stepWater.toFixed(1)}g)</span></div><div class="step-note">${step.note}</div>`; 
            stepsList.appendChild(stepDiv); 
        }); 
        
        document.getElementById('resultBox').style.style.display = 'block'; 
        document.getElementById('recipeDetails').removeAttribute('open'); 
    }

    window.onload = function() {
        syncFromSlider(sliderEl.value);
        updateRecipeDetailsView();
        document.getElementById('recipeDetails').removeAttribute('open');
    };
