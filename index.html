<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COFFEE BREWING ASSISTANT · 咖啡冲煮助手</title>
    <style>
        :root {
            --bg-color: #f4ede4;       /* 带有纸张质感的温暖浅色底 */
            --container-bg: #ffffff;
            --primary-color: #3d2b1f;  /* 极浓的浓缩咖啡色 */
            --accent-color: #c68e5a;   /* 烘焙金 */
            --text-main: #2c1d11;
            --text-muted: #8c7667;
            --border-color: #ebdcd0;
            --highlight-bg: #fdfcfb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 主容器：引入相对定位，为底层抽象大图形做准备 */
        .container {
            background: var(--container-bg);
            padding: 40px 28px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(61, 43, 31, 0.08);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* 抽象背景图腾一：顶部巨大的几何滤杯与豆（数量少、体积大、极度抽象） */
        .bg-abstract-top {
            position: absolute;
            top: -20px;
            right: -30px;
            width: 180px;
            height: 180px;
            opacity: 0.12; /* 隐隐约约，不干扰视线 */
            z-index: -1;
            pointer-events: none;
        }

        /* 抽象背景图腾二：底部巨大的流线型手冲壶弧线 */
        .bg-abstract-bottom {
            position: absolute;
            bottom: -40px;
            left: -30px;
            width: 220px;
            height: 220px;
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
        }

        /* 中英文洋气标题区，增强间距 */
        .brand-header {
            text-align: left; /* 改为左对齐，增强现代感 */
            margin-bottom: 35px;
            padding-left: 4px;
        }
        .brand-header .en-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-color);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .brand-header .zh-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
            color: var(--text-main);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color); /* 聚焦时变为深色深线条 */
            box-shadow: 0 0 0 4px rgba(61, 43, 31, 0.05);
        }

        #ratioContainer {
            display: block;
            background-color: #faf7f2;
            padding: 18px;
            border-radius: 18px;
            border: 1px dashed var(--border-color);
        }

        /* 精细重构的折叠详述模块 */
        .recipe-details-box {
            margin-top: 25px;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            background: var(--highlight-bg);
        }

        summary {
            padding: 16px 20px;
            background: #f4ede4;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::after {
            content: "";
            width: 7px;
            height: 7px;
            border-right: 2px solid var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            transform: rotate(45deg);
            transition: transform 0.25s ease;
            margin-right: 4px;
        }

        details[open] summary::after {
            transform: rotate(-135deg);
        }

        .details-content {
            padding: 24px 20px;
            font-size: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: #fff;
        }

        .info-item {
            display: flex;
            flex-direction: column; /* 改为垂直排布，显得更干净 */
            gap: 4px;
        }

        .info-item.full-width {
            grid-column: span 2;
            border-top: 1px dashed #f0eae1;
            padding-top: 16px;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            color: var(--text-main);
            font-weight: 600;
            font-size: 14.5px;
        }

        /* 一键冲煮大按钮 */
        button {
            width: 100%;
            padding: 18px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #261b13;
            box-shadow: 0 8px 20px rgba(61, 43, 31, 0.15);
        }

        /* 结果面板 */
        .result {
            margin-top: 30px;
            padding: 24px 20px;
            background-color: var(--highlight-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            display: none;
        }

        .result h3 {
            margin: 0 0 18px 0;
            color: var(--primary-color);
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .total-highlight {
            font-size: 14px;
            margin-bottom: 24px;
            background: #f4ede4;
            padding: 16px;
            border-radius: 12px;
            color: var(--primary-color);
            line-height: 1.6;
        }

        .step {
            margin: 20px 0;
            padding-bottom: 20px;
            border-bottom: 1px dashed #e6dfd8;
        }

        .step:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .step-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
        }

        .step-details {
            font-size: 16px;
            color: #000;
            margin-bottom: 6px;
        }

        .step-note {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    
    <svg class="bg-abstract-top" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.5" stroke-linecap="round">
        <path d="M10 20 L90 20 L50 85 Z" />
        <line x1="25" y1="44" x2="75" y2="44" stroke-dasharray="2 3" />
        <circle cx="50" cy="20" r="18" fill="none" stroke-width="1" />
        <path d="M40 10 C45 20 50 20 60 30" stroke-width="1.5" />
    </svg>

    <svg class="bg-abstract-bottom" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.2">
        <path d="M10 90 C10 40, 50 30, 60 30" stroke-width="2" />
        <path d="M60 30 C75 30, 90 10, 85 5" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="10" cy="90" r="30" stroke-dasharray="4 4" />
    </svg>

    <div class="brand-header">
        <div class="en-title">Coffee Brewing Assistant</div>
        <div class="zh-title">咖啡冲煮助手</div>
    </div>
    
    <div class="input-group">
        <label for="beans">咖啡粉重量 (克):</label>
        <input type="number" id="beans" value="15" min="1" step="0.1">
    </div>

    <div class="input-group">
        <label for="recipe">选择冲煮方案:</label>
        <select id="recipe" onchange="onRecipeChange()">
            <option value="classic">经典三段式 (均衡基石)</option>
            <option value="four_six">粕谷哲 四六冲煮法 (风味定制)</option>
            <option value="one_pour">极致一刀流 (干净通透)</option>
            <option value="carlos">Carlos Medina 五段精准法 (世界冠军)</option>
            <option value="du">杜嘉宁 高温快冲法 (世界冠军)</option>
        </select>
    </div>

    <div class="input-group" id="ratioContainer">
        <label for="ratio">调节粉水比:</label>
        <select id="ratio">
            <option value="16">1 : 16 (轻盈明亮，拉伸花果香)</option>
            <option value="15">1 : 15 (醇厚饱满，风味更扎实)</option>
        </select>
    </div>

    <details class="recipe-details-box" id="recipeDetails" open>
        <summary>查看当前方案策略详述</summary>
        <div class="details-content">
            <div class="info-item">
                <span class="info-label">推荐水温</span>
                <span class="info-value" id="viewTemp">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">推荐器具</span>
                <span class="info-value" id="viewGear">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">研磨度锚点</span>
                <span class="info-value" id="viewGrind">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">预估时间</span>
                <span class="info-value" id="viewTime">-</span>
            </div>
            <div class="info-item full-width">
                <span class="info-label">风味特征表现</span>
                <span class="info-value" id="viewFlavor">-</span>
            </div>
        </div>
    </details>

    <button onclick="calculateBrew()">生成今日冲煮看板</button>

    <div id="resultBox" class="result">
        <h3>冲煮看板</h3>
        <div class="total-highlight">
            设定比例：<strong><span id="currentRatio"></span></strong><br>
            目标总注水量：<strong id="totalWater" style="color:var(--accent-color); font-size:20px;"></strong> <strong>克</strong>
        </div>
        <div id="stepsList"></div>
    </div>
</div>

<script>
    const recipes = {
        "classic": {
            hasDynamicRatio: true,
            temp: "91℃ - 93℃",
            gear: "V60 / 蛋糕滤杯",
            grind: "中等研磨",
            time: "2'15\" - 2'45\"",
            flavor: "酸甜均衡，层次感清晰，容错率极高，适合日常基准测试。",
            steps: [
                { name: "第一段 (闷蒸)", percentage: 0.20, note: "充分打湿粉床，闷蒸30秒，释放二氧化碳。" },
                { name: "第二段 (核心萃取)", percentage: 0.40, note: "向外绕圈，稳定水流，逼出中段高甜感。" },
                { name: "第三段 (尾段稀释)", percentage: 0.40, note: "平稳中心注水，避免过度扰动引起尾段苦涩。" }
            ]
        },
        "four_six": {
            hasDynamicRatio: false,
            fixedRatio: 15,
            temp: "92℃ - 93℃",
            gear: "Hario V60",
            grind: "粗研磨 (粗砂糖感)",
            time: "3'15\" - 3'30\"",
            flavor: "高醇厚度与干净度。通过前两段水量平衡酸甜，后三段决定浓度。",
            steps: [
                { name: "第一段 (决定酸度)", percentage: 0.20, note: "前40%的第一段。若想偏甜，可适当减少此段水量。" },
                { name: "第二段 (决定甜度)", percentage: 0.20, note: "前40%的第二段。注入完成等待水完全流下（约1'00\"）。" },
                { name: "第三段 (提升浓度)", percentage: 0.20, note: "后60%均分三段的开始。每次等水流干后再注下一段。" },
                { name: "第四段 (提升浓度)", percentage: 0.20, note: "保持断水节奏，精准对齐克重。" },
                { name: "第五段 (最后收尾)", percentage: 0.20, note: "注满最后1/5水量，静置等待滴滤完成。" }
            ]
        },
        "one_pour": {
            hasDynamicRatio: false,
            fixedRatio: 16,
            temp: "90℃ - 92℃",
            gear: "V60 / Origami",
            grind: "中细研磨",
            time: "1'50\" - 2'10\"",
            flavor: "口感极为干净、通透，没有多次断水带来的杂质扰动。",
            steps: [
                { name: "第一段 (充分闷蒸)", percentage: 0.20, note: "使用两倍于粉重的水量充分浸润，闷蒸30秒。" },
                { name: "第二段 (一刀流拉满)", percentage: 0.80, note: "中心温柔注水，不间断地缓慢提高水位至总克重，随后静置。" }
            ]
        },
        "carlos": {
            hasDynamicRatio: false,
            fixedRatio: 16.1,
            temp: "91℃",
            gear: "Orea V3 / 平底滤杯",
            grind: "中粗研磨",
            time: "2'30\" (每段严格隔30s)",
            flavor: "极致的物理均匀度，风味极为清晰，呈现极其高雅的甜感。",
            steps: [
                { name: "第一段 (0:00 闷蒸)", percentage: 0.20, note: "精确绕圈，打湿每一颗粉末。" },
                { name: "第二段 (0:30 注水)", percentage: 0.20, note: "保持固定的注水高度和画圈半径。" },
                { name: "第三段 (1:00 注水)", percentage: 0.20, note: "严格控制水流力度，避免过度扰动。" },
                { name: "第四段 (1:30 注水)", percentage: 0.20, note: "细水流稳定推进。" },
                { name: "第五段 (2:00 精准收尾)", percentage: 0.20, note: "最后一段注入，等待滤滤流干。" }
            ]
        },
        "du": {
            hasDynamicRatio: false,
            fixedRatio: 15,
            temp: "94℃ (高温萃取)",
            gear: "Origami (高流速)",
            grind: "极细研磨",
            time: "1'40\" (快打战术)",
            flavor: "爆炸般的花果香气，极高的萃取率带来扎实的醇厚度与爆发力。",
            steps: [
                { name: "第一段 (快冲闷蒸)", percentage: 0.20, note: "大水流（约6g/s）快速注入，迅速打湿粉床，激活酸质。" },
                { name: "第二段 (中心控速)", percentage: 0.3333, note: "放缓水流至4g/s，中心绕小圈，延长接触时间逼出醇厚度。" },
                { name: "第三段 (大水流收尾)", percentage: 0.4667, note: "恢复5g/s大水流冲刺至总量，务必在1分40秒内结束冲煮。" }
            ]
        }
    };

    function updateRecipeDetailsView() {
        const recipeKey = document.getElementById('recipe').value;
        const recipe = recipes[recipeKey];
        
        document.getElementById('viewTemp').innerText = recipe.temp;
        document.getElementById('viewGear').innerText = recipe.gear;
        document.getElementById('viewGrind').innerText = recipe.grind;
        document.getElementById('viewTime').innerText = recipe.time;
        document.getElementById('viewFlavor').innerText = recipe.flavor;

        const ratioContainer = document.getElementById('ratioContainer');
        if (recipe.hasDynamicRatio) {
            ratioContainer.style.display = 'block';
        } else {
            ratioContainer.style.display = 'none';
        }
    }

    function onRecipeChange() {
        updateRecipeDetailsView();
        document.getElementById('resultBox').style.display = 'none';
    }

    function calculateBrew() {
        const beans = parseFloat(document.getElementById('beans').value);
        const recipeKey = document.getElementById('recipe').value;
        const recipe = recipes[recipeKey];
        
        if (!beans || beans <= 0) {
            alert("请输入正确的咖啡豆克重！");
            return;
        }

        let activeRatio = recipe.hasDynamicRatio ? parseFloat(document.getElementById('ratio').value) : recipe.fixedRatio;
        const totalWater = beans * activeRatio;
        
        document.getElementById('currentRatio').innerText = `1 : ${activeRatio}`;
        document.getElementById('totalWater').innerText = totalWater.toFixed(1);
        
        const stepsList = document.getElementById('stepsList');
        stepsList.innerHTML = '';
        
        let cumulativeWater = 0;

        recipe.steps.forEach((step) => {
            const stepWater = totalWater * step.percentage;
            cumulativeWater += stepWater;
            
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step';
            stepDiv.innerHTML = `
                <div class="step-title">
                    <span>${step.name}</span>
                    <span style="font-size:11px; color:var(--text-muted);">权重 ${(step.percentage * 100).toFixed(0)}%</span>
                </div>
                <div class="step-details">
                    电子秤注水至：<strong style="color:var(--primary-color); font-size:17px;">${cumulativeWater.toFixed(1)}g</strong> 
                    <span style="color:var(--text-muted); font-size:13px;">(本段注入 ${stepWater.toFixed(1)}g)</span>
                </div>
                <div class="step-note">${step.note}</div>
            `;
            stepsList.appendChild(stepDiv);
        });

        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('recipeDetails').removeAttribute('open');
    }

    window.onload = updateRecipeDetailsView;
</script>

</body>
</html>
