    <style>
        :root {
            --bg-color: #f4ede4;
            --container-bg: #ffffff;
            --primary-color: #3d2b1f;
            --accent-color: #c68e5a;
            --text-main: #2c1d11;
            --text-muted: #8c7667;
            --border-color: #ebdcd0;
            --highlight-bg: #fdfcfb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--container-bg);
            padding: 40px 28px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(61, 43, 31, 0.08);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .bg-abstract-top { position: absolute; top: -20px; right: -30px; width: 180px; height: 180px; opacity: 0.12; z-index: -1; pointer-events: none; }
        .bg-abstract-bottom { position: absolute; bottom: -40px; left: -30px; width: 220px; height: 220px; opacity: 0.08; z-index: -1; pointer-events: none; }

        .brand-header { text-align: left; margin-bottom: 35px; padding-left: 4px; }
        .brand-header .en-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--accent-color); margin-bottom: 6px; text-transform: uppercase; }
        .brand-header .zh-title { font-size: 26px; font-weight: 800; color: var(--primary-color); letter-spacing: 1px; }

        .input-group {
            margin-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        /* 🆕 方案三：通透光影毛玻璃面板结构 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(235, 220, 208, 0.7);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 8px 32px rgba(61, 43, 31, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* 居中超大数字显示与铅笔图标组 */
        .center-display-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            height: 48px;
            user-select: none;
        }

        .beans-large-text {
            font-size: 38px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: -0.5px;
            font-variant-numeric: tabular-nums;
        }

        .beans-unit {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 12px;
        }

        /* 方案二：精致小铅笔图标 */
        .edit-pencil-icon {
            width: 20px;
            height: 20px;
            color: var(--accent-color);
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
            margin-top: 4px;
        }
        .center-display-wrapper:hover .edit-pencil-icon {
            opacity: 1;
            transform: scale(1.1);
        }

        /* 隐藏的手动输入框（点击数字时切出） */
        .beans-input-hidden {
            display: none;
            width: 120px;
            height: 42px;
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color);
            text-align: center;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            background: #fff;
            outline: none;
            box-shadow: 0 4px 12px rgba(198, 142, 90, 0.1);
        }

        /* 缩小精致化横向滚轮轨道 */
        .grinder-slider-box {
            position: relative;
            width: 100%;
            padding: 4px 0;
        }

        /* 极其纤细精密的背景刻度线 */
        .grinder-fine-ticks {
            position: absolute;
            left: 10px;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            height: 6px;
            background: linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 2.22% 100%; /* 适配更密集的物理刻度感 */
            opacity: 0.5;
            pointer-events: none;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 24px;
            background: transparent;
            outline: none;
            margin: 0;
            cursor: ew-resize;
            position: relative;
            z-index: 2;
        }

        /* 高级通透滑块触点 (Thumb) */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 26px;
            border-radius: 4px;
            background: var(--primary-color);
            box-shadow: 0 2px 6px rgba(61, 43, 31, 0.4);
            transition: transform 0.1s, background-color 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.15);
            background: var(--accent-color);
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 26px;
            border-radius: 4px;
            background: var(--primary-color);
            border: none;
            box-shadow: 0 2px 6px rgba(61, 43, 31, 0.4);
        }

        /* 原有其他选择器及布局样式 */
        .select-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background-color: #fff;
            overflow: hidden;
            transition: all 0.25s ease;
            box-sizing: border-box;
            width: 100%;
            height: 56px;
        }

        .select-wrapper:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(61, 43, 31, 0.05);
        }

        select { 
            width: 100%; 
            height: 100%;
            padding: 0 60px 0 18px; 
            border: none; 
            font-size: 16px; 
            background: transparent; 
            color: var(--text-main); 
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 10px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 100%;
            position: absolute;
            right: 0;
            top: 0;
            background: #fdfcfb;
            border-left: 1px solid var(--border-color);
            pointer-events: none;
            flex-shrink: 0;
        }

        #ratioContainer { display: block; background-color: #faf7f2; padding: 18px; border-radius: 18px; border: 1px dashed var(--border-color); }
        .recipe-details-box { margin-top: 25px; border: 1px solid var(--border-color); border-radius: 18px; overflow: hidden; background: var(--highlight-bg); }
        
        summary { padding: 16px 20px; background: #f4ede4; color: var(--primary-color); font-weight: 700; font-size: 13px; letter-spacing: 1px; cursor: pointer; outline: none; user-select: none; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--primary-color); border-bottom: 2px solid var(--primary-color); transform: rotate(45deg); transition: transform 0.25s ease; margin-right: 4px; }
        details[open] summary::after { transform: rotate(-135deg); }
        
        .recipe-details-box .details-content { display: none; }
        .recipe-details-box[open] .details-content { 
            padding: 24px 20px; 
            font-size: 14px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            background: #fff; 
        }

        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .info-item.full-width { grid-column: span 2; border-top: 1px dashed #f0eae1; padding-top: 16px; }
        .info-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .info-value { color: var(--text-main); font-weight: 600; font-size: 14.5px; }
        
        button#mainBtn { width: 100%; padding: 18px; background-color: var(--primary-color); color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer; margin-top: 24px; transition: all 0.2s ease; line-height: 1; }
        button#mainBtn:hover { background-color: #261b13; box-shadow: 0 8px 20px rgba(61, 43, 31, 0.15); }
        
        .result { margin-top: 30px; padding: 24px 20px; background-color: var(--highlight-bg); border-radius: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary-color); display: none; }
        .result h3 { margin: 0 0 18px 0; color: var(--primary-color); font-size: 16px; font-weight: 800; letter-spacing: 1px; }
        .total-highlight { font-size: 14px; margin-bottom: 24px; background: #f4ede4; padding: 16px; border-radius: 12px; color: var(--primary-color); line-height: 1.6; }
        .step { margin: 20px 0; padding-bottom: 20px; border-bottom: 1px dashed #e6dfd8; }
        .step:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .step-title { font-weight: 700; color: var(--primary-color); margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 15px; }
        .step-details { font-size: 16px; color: #000; margin-bottom: 6px; }
        .step-note { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <svg class="bg-abstract-top" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.5" stroke-linecap="round"><path d="M10 20 L90 20 L50 85 Z" /><line x1="25" y1="44" x2="75" y2="44" stroke-dasharray="2 3" /><circle cx="50" cy="20" r="18" fill="none" stroke-width="1" /><path d="M40 10 C45 20 50 20 60 30" stroke-width="1.5" /></svg>
    <svg class="bg-abstract-bottom" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.2"><path d="M10 90 C10 40, 50 30, 60 30" stroke-width="2" /><path d="M60 30 C75 30, 90 10, 85 5" stroke-width="1.5" stroke-linecap="round" /><circle cx="10" cy="90" r="30" stroke-dasharray="4 4" /></svg>

    <div class="brand-header">
        <div class="en-title">Coffee Brewing Assistant</div>
        <div class="zh-title">咖啡冲煮助手</div>
    </div>
    
    <div class="input-group">
        <label>咖啡粉重量:</label>
        <div class="glass-panel">
            <div class="center-display-wrapper" id="displayWrapper" onclick="enableManualInput()">
                <span class="beans-large-text" id="beansValue">15.0</span>
                <span class="beans-unit">克</span>
                <svg class="edit-pencil-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"></path>
                </svg>
            </div>
            <input type="number" id="beansInput" class="beans-input-hidden" step="0.1" min="5" max="50" onblur="disableManualInput()">

            <div class="grinder-slider-box">
                <div class="grinder-fine-ticks"></div>
                <input type="range" id="beansSlider" min="5" max="50" step="0.1" value="15.0" oninput="syncFromSlider(this.value)">
            </div>
        </div>
    </div>

    <div class="input-group">
        <label for="recipe">选择冲煮方案:</label>
        <div class="select-wrapper">
            <select id="recipe" onchange="onRecipeChange()">
                <option value="classic">经典三段式</option>
                <option value="four_six">粕谷哲 四六冲煮法</option>
                <option value="one_pour">极致一刀流 (干净通透)</option>
                <option value="carlos">Carlos Medina 五段精准法</option>
                <option value="du">杜嘉宁 高温快冲法</option>
            </select>
        </div>
    </div>

    <div class="input-group" id="ratioContainer">
        <label for="ratio">调节粉水比:</label>
        <div class="select-wrapper">
            <select id="ratio">
                <option value="16">1 : 16</option>
                <option value="15">1 : 15</option>
            </select>
        </div>
    </div>

    <details class="recipe-details-box" id="recipeDetails"><summary>查看当前方案策略详述</summary><div class="details-content"><div class="info-item"><span class="info-label">推荐水温</span><span class="info-value" id="viewTemp">-</span></div><div class="info-item"><span class="info-label">推荐器具</span><span class="info-value" id="viewGear">-</span></div><div class="info-item"><span class="info-label">研磨度锚点</span><span class="info-value" id="viewGrind">-</span></div><div class="info-item"><span class="info-label">预估时间</span><span class="info-value" id="viewTime">-</span></div><div class="info-item full-width"><span class="info-label">风味特征表现</span><span class="info-value" id="viewFlavor">-</span></div></div></details>
    
    <button onclick="calculateBrew()" id="mainBtn">生成今日冲煮看板</button>
    <div id="resultBox" class="result"><h3>冲煮看板</h3><div class="total-highlight">设定比例：<strong><span id="currentRatio"></span></strong><br>目标总注水量：<strong id="totalWater" style="color:var(--accent-color); font-size:20px;"></strong> <strong>克</strong></div><div id="stepsList"></div></div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js?v=3.2')
                .then(reg => console.log('PWA 离线管家已强行重构升级。'))
                .catch(err => console.log(err));
        });
    }

    const sliderEl = document.getElementById('beansSlider');
    const textEl = document.getElementById('beansValue');
    const inputEl = document.getElementById('beansInput');
    const wrapperEl = document.getElementById('displayWrapper');

    // 🔄 1. 拖动滚轮：实时同步数据到居中大字
    function syncFromSlider(val) {
        textEl.innerText = parseFloat(val).toFixed(1);
        inputEl.value = parseFloat(val).toFixed(1);
    }

    // ⌨️ 2. 点击进入手动填入状态
    function enableManualInput() {
        wrapperEl.style.display = 'none';
        inputEl.style.display = 'block';
        inputEl.value = textEl.innerText;
        inputEl.focus();
    }

    // 🔒 3. 填完失焦：校验范围并自动回弹、同步滚轮
    function disableManualInput() {
        let val = parseFloat(inputEl.value);
        const min = parseFloat(sliderEl.min);
        const max = parseFloat(sliderEl.max);

        if (isNaN(val) || val < min) val = min;
        if (val > max) val = max;

        val = Number(val.toFixed(1));
        
        // 同步给大字和滑块
        textEl.innerText = val.toFixed(1);
        sliderEl.value = val;

        inputEl.style.display = 'none';
        wrapperEl.style.display = 'flex';
    }

    const recipes = {

    function updateRecipeDetailsView() { 
        const recipeKey = document.getElementById('recipe').value; 
        const recipe = recipes[recipeKey]; 
        document.getElementById('viewTemp').innerText = recipe.temp; 
        document.getElementById('viewGear').innerText = recipe.gear; 
        document.getElementById('viewGrind').innerText = recipe.grind; 
        document.getElementById('viewTime').innerText = recipe.time; 
        document.getElementById('viewFlavor').innerText = recipe.flavor; 
        
        const ratioContainer = document.getElementById('ratioContainer'); 
        if (recipe.hasDynamicRatio) { 
            ratioContainer.style.display = 'block'; 
        } else { 
            ratioContainer.style.display = 'none'; 
        } 
    }
    
    function onRecipeChange() { 
        updateRecipeDetailsView(); 
        document.getElementById('resultBox').style.display = 'none'; 
        document.getElementById('recipeDetails').removeAttribute('open');
    }
    
    function calculateBrew() { 
        // 核心改动：直接抓取当前的 Slider 确定克数
        const beans = parseFloat(sliderEl.value); 
        const recipeKey = document.getElementById('recipe').value; 
        const recipe = recipes[recipeKey]; 
        if (!beans || beans <= 0) { alert("请确定正确的咖啡豆克重！"); return; } 
        
        let activeRatio = recipe.hasDynamicRatio ? parseFloat(document.getElementById('ratio').value) : recipe.fixedRatio; 
        const totalWater = beans * activeRatio; 
        document.getElementById('currentRatio').innerText = `1 : ${activeRatio}`; 
        document.getElementById('totalWater').innerText = totalWater.toFixed(1); 
        
        const stepsList = document.getElementById('stepsList'); 
        stepsList.innerHTML = ''; 
        let cumulativeWater = 0; 
        
        recipe.steps.forEach((step) => { 
            const stepWater = totalWater * step.percentage; 
            cumulativeWater += stepWater; 
            const stepDiv = document.createElement('div'); 
            stepDiv.className = 'step'; 
            stepDiv.innerHTML = `<div class="step-title"><span>${step.name}</span><span style="font-size:11px; color:var(--text-muted);">权重 ${(step.percentage * 100).toFixed(0)}%</span></div><div class="step-details">注水至：<strong style="color:var(--primary-color); font-size:17px;">${cumulativeWater.toFixed(1)}g</strong> <span style="color:var(--text-muted); font-size:13px;">(本段注入 ${stepWater.toFixed(1)}g)</span></div><div class="step-note">${step.note}</div>`; 
            stepsList.appendChild(stepDiv); 
        }); 
        
        document.getElementById('resultBox').style.display = 'block'; 
        document.getElementById('recipeDetails').removeAttribute('open'); 
    }

    window.onload = function() {
        syncFromSlider(sliderEl.value);
        updateRecipeDetailsView();
        document.getElementById('recipeDetails').removeAttribute('open');
    };
</script>
